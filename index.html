
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#10141e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スマブラ対策図鑑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>スマブラSP 対策図鑑</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#10141e;color:#fff;font-family:"Segoe UI",sans-serif}
header{padding:24px 15px;text-align:center;background:linear-gradient(120deg,#36435b,#10141e);border-bottom:4px solid #efc04f}
header small{color:#efc04f;font-weight:900;letter-spacing:2px}
h1{font-size:clamp(22px,4vw,36px);margin:8px 0}
header p{color:#b8c3d4;font-size:13px}
.toolbar{max-width:1100px;margin:auto;padding:15px;display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;background:#263246;border:1px solid #607086;border-radius:7px;color:white;padding:10px}
input[type=search]{flex:1;min-width:130px}
button{cursor:pointer;font:inherit}
.btn{background:#344258;color:white;border:1px solid #607086;border-radius:7px;padding:10px 13px;font-weight:bold}
.btn:hover{background:#475b75}
.primary{background:#efc04f;color:#181d26;border-color:#efc04f}
.primary:hover{background:#ffd779}
.grid{max-width:1100px;margin:auto;padding:8px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.fighter{position:relative;aspect-ratio:0.85;background:linear-gradient(135deg,#52647d,#253145);border:1px solid #697b95;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center}
.fighter:hover{border:2px solid #f6d16c;filter:brightness(1.15)}
.fighter img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.placeholder{width:50%;height:50%;opacity:.45;fill:#c1cde0}
.fighter.mine{border:3px solid #efc04f;background:linear-gradient(135deg,#8b6824,#382a16)}
.mine::before{content:"★";position:absolute;top:3px;left:5px;color:#ffd76c;z-index:2;font-size:15px}
.dot{position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:#efc04f;box-shadow:0 0 4px #111}
footer{text-align:center;color:#a8b7cb;font-size:12px;padding:22px}
.overlay{position:fixed;inset:0;background:#050810dc;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.hidden{display:none!important}
.modal{background:#202c3d;border:2px solid #efc04f;border-radius:12px;width:min(100%,560px);max-height:90dvh;overflow-y:auto;padding:18px}
.modalhead{display:flex;align-items:center;gap:12px}
.avatar{width:75px;height:75px;object-fit:cover;background:#394960;border:1px solid #607086}
.modalhead h2{margin:3px 0;font-size:22px}
.close{margin-left:auto;align-self:flex-start}
.entry{background:#303e52;border-left:4px solid #efc04f;padding:12px;margin:10px 0;border-radius:5px}
.entry strong{color:#f4cd65}
.entry p{white-space:pre-wrap;line-height:1.6;margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1}
.editrow{background:#2b394d;border-radius:7px;padding:10px;margin:10px 0;display:grid;gap:7px}
.editrow input,.editrow textarea{width:100%}
.editrow textarea{min-height:75px;resize:vertical}
.note{font-size:12px;color:#b8c6d8;line-height:1.6}
.status{color:#f4cd65;font-size:12px;margin-top:8px}
@media(min-width:650px){.grid{grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(12,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<small>SUPER SMASH BROS. SPECIAL</small>
<h1>キャラ対策 SELECT</h1>
<p>デデデ使い専用・キャラ対策図鑑</p>
</header>

<div class="toolbar">
<input id="search" type="search" placeholder="キャラを検索…">
<button class="btn" id="exportBtn">バックアップ</button>
<button class="btn" id="importBtn">復元</button>
<input id="importFile" type="file" accept=".json" hidden>
</div>

<main class="grid" id="grid"></main>

<footer>
全84枠｜金色の枠はデデデ立ち回り専用<br>
キャラをタップして対策を確認！
</footer>

<div class="overlay hidden" id="overlay">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modalhead">
<img id="avatar" class="avatar" alt="">
<div style="flex:1">
<small style="color:#efc04f">FIGHTER DATA</small>
<h2 id="modalTitle"></h2>
<div id="memoCount" class="note"></div>
</div>
<button class="btn close" id="closeBtn">✕</button>
</div>

<div id="view"></div>

<div id="viewActions" class="actions">
<button class="btn primary" id="editBtn">対策を編集</button>
<button class="btn" id="imageBtn">画像を登録</button>
<input type="file" id="imageFile" accept="image/*" hidden>
</div>

<div id="editor" class="hidden">
<h3>メモを編集</h3>
<div id="editRows"></div>
<button class="btn" id="addBtn" style="width:100%">＋ メモを追加</button>
<div class="actions">
<button class="btn primary" id="saveBtn">保存</button>
<button class="btn" id="cancelBtn">キャンセル</button>
</div>
</div>

<p class="note">
画像とメモはこのブラウザに保存されます。
別の端末へ移すときはバックアップを使用してください。
</p>
<div class="status" id="status"></div>
</section>
</div>

<script>
// ファイター一覧（先頭はデデデ専用枠）
const fighters = [
"★ デデデ立ち回り",
"マリオ","ドンキーコング","リンク",
"サムス/ダークサムス","ヨッシー","カービィ",
"フォックス","ピカチュウ","ルイージ","ネス",
"キャプテン・ファルコン","プリン","ピーチ/デイジー",
"クッパ","アイスクライマー","シーク","ゼルダ",
"ドクターマリオ","ピチュー","ファルコ","マルス",
"ルキナ","こどもリンク","ガノンドロフ","ミュウツー",
"ロイ","クロム","Mr.ゲーム＆ウォッチ","メタナイト",
"ピット","ブラックピット","ゼロスーツサムス",
"ワリオ","スネーク","アイク","ポケモントレーナー",
"ディディーコング","リュカ","ソニック","デデデ",
"ピクミン＆オリマー","ルカリオ","ロボット",
"トゥーンリンク","ウルフ","むらびと","ロックマン",
"Wii Fit トレーナー","ロゼッタ＆チコ",
"リトル・マック","ゲッコウガ",
"Mii 格闘タイプ","Mii 剣術タイプ","Mii 射撃タイプ",
"パルテナ","パックマン","ルフレ","シュルク",
"クッパJr.","ダックハント","リュウ","ケン",
"クラウド","カムイ","ベヨネッタ","インクリング",
"リドリー","シモン/リヒター","キングクルール",
"しずえ","ガオガエン","パックンフラワー",
"ジョーカー","勇者","バンジョー＆カズーイ",
"テリー","ベレト/ベレス","ミェンミェン",
"スティーブ","セフィロス","ホムラ/ヒカリ",
"カズヤ","ソラ"
];

// 初期対策メモ
const initialNotes = {
"★ デデデ立ち回り": [
["基本の立ち回り",""],
["攻め・コンボ",""],
["守り・着地",""],
["崖・復帰",""],
["その他",""]
],
"Mr.ゲーム＆ウォッチ":[
["空前","移動回避で後ろへ回り込む"],
["真上からの攻め","上Bで反撃されるため避ける"]
],
"リンク":[
["小ジャンプ空後","一発目の後にガーキャン上スマ"],
["崖の爆弾","その場上がりを避ける"]
],
"ロボット":[
["高所で上B","ゴルドーを置いて着地拒否"]
],
"ファルコ":[
["空N急降下","上ずらしで脱出"]
],
"ルイージ":[
["序盤","単発横強を使わない"]
],
"クッパJr.":[
["横Bでステージ復帰","崖離しで空後"]
],
"ケン":[
["コンボ中","背後に空中移動回避"],
["小ジャンプゴルドー","飛び越えられて空前を食らうので注意"],
["引き横強","引き空前で対処"]
],
"カズヤ":[
["崖寄りジェットハンマー","崖から離れてからセット"],
["ジャンプ急降下攻撃","2〜3回ホバリングしてから攻撃"],
["透かしつかみ","多めに使う"],
["崖端のデデデ","空ダ吸い込みで崖下へ放つ"]
]
};

const STORAGE_KEY = "smash-special-final-v1";
const $ = id => document.getElementById(id);

let data = {
 notes: structuredClone(initialNotes),
 images: {}
};
let selected = null;

// 保存済みデータを読み込む
try {
 const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
 if(saved && saved.notes && saved.images) data = saved;
} catch(e) {
 console.warn("保存データを読み込めませんでした",e);
}

function saveData() {
 try {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  $("status").textContent = "保存したにゃん！";
  return true;
 } catch(e) {
  $("status").textContent =
   "保存容量が足りません。バックアップを取ってください。";
  return false;
 }
}

function make(tag,text,cls) {
 const e=document.createElement(tag);
 if(text!==undefined)e.textContent=text;
 if(cls)e.className=cls;
 return e;
}

const silhouette = `<svg class="placeholder" viewBox="0 0 64 64">
<circle cx="32" cy="20" r="13"/>
<path d="M7 62c0-18 10-27 25-27s25 9 25 27z"/>
</svg>`;

function renderGrid() {
 const grid=$("grid");
 grid.replaceChildren();
 const query=$("search").value.trim().toLowerCase();

 fighters.forEach((name,index)=>{
  if(!name.toLowerCase().includes(query))return;

  const button=make("button",undefined,
   "fighter"+(index===0?" mine":""));
  button.type="button";
  button.setAttribute("aria-label",name+"のメモを開く");

  if(data.images[name]){
   const img=make("img");
   img.src=data.images[name];
   img.alt="";
   button.append(img);
  } else {
   const holder=make("div");
   holder.innerHTML=silhouette;
   button.append(holder);
  }

  if((data.notes[name]||[]).length){
   button.append(make("span",undefined,"dot"));
  }

  button.onclick=()=>openModal(name);
  grid.append(button);
 });
}

function openModal(name) {
 selected=name;
 $("modalTitle").textContent=name;
 $("avatar").src=data.images[name]||makePlaceholder();
 $("overlay").classList.remove("hidden");
 $("status").textContent="";
 showNotes();
}

function makePlaceholder(){
 return "data:image/svg+xml,"+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg"
  width="100" height="100">
  <rect width="100" height="100" fill="#3b4b61"/>
  <circle cx="50" cy="35" r="18" fill="#9bacc2"/>
  <path d="M10 100Q10 55 50 55T90 100"
  fill="#9bacc2"/></svg>`
 );
}

function showNotes(){
 $("editor").classList.add("hidden");
 $("view").classList.remove("hidden");
 $("viewActions").classList.remove("hidden");

 const area=$("view");
 area.replaceChildren();
 const notes=data.notes[selected]||[];

 $("memoCount").textContent=notes.length+" 件のメモ";

 if(!notes.length){
  area.append(make("p",
   "まだメモがないよ。編集ボタンから追加してね！",
   "note"));
 }

 notes.forEach(([title,body])=>{
  const entry=make("div",undefined,"entry");
  entry.append(make("strong",title));
  entry.append(make("p",body||"（未記入）"));
  area.append(entry);
 });
}

function addEditRow(title="",body=""){
 const row=make("div",undefined,"editrow");
 const titleInput=make("input");
 titleInput.placeholder="技・場面・カテゴリー";
 titleInput.value=title;

 const bodyInput=make("textarea");
 bodyInput.placeholder="立ち回りや対策を入力";
 bodyInput.value=body;

 const del=make("button","このメモを削除","btn");
 del.type="button";
 del.onclick=()=>row.remove();

 row.append(titleInput,bodyInput,del);
 $("editRows").append(row);
}

$("editBtn").onclick=()=>{
 $("view").classList.add("hidden");
 $("viewActions").classList.add("hidden");
 $("editor").classList.remove("hidden");
 $("editRows").replaceChildren();

 (data.notes[selected]||[]).forEach(
  note=>addEditRow(note[0],note[1])
 );

 if(!$("editRows").children.length)addEditRow();
};

$("addBtn").onclick=()=>addEditRow();

$("saveBtn").onclick=()=>{
 const notes=[];

 $("editRows").querySelectorAll(".editrow").forEach(row=>{
  const title=row.querySelector("input").value.trim();
  const body=row.querySelector("textarea").value.trim();
  if(title||body)notes.push([title,body]);
 });

 data.notes[selected]=notes;
 saveData();
 renderGrid();
 showNotes();
};

$("cancelBtn").onclick=showNotes;

$("closeBtn").onclick=()=>{
 $("overlay").classList.add("hidden");
 selected=null;
};

$("overlay").onclick=e=>{
 if(e.target===$("overlay"))$("closeBtn").click();
};

document.addEventListener("keydown",e=>{
 if(e.key==="Escape" && selected!==null)
  $("closeBtn").click();
});

$("search").oninput=renderGrid;

// 画像を登録して縮小保存
$("imageBtn").onclick=()=>$("imageFile").click();

$("imageFile").onchange=e=>{
 const file=e.target.files[0];
 if(!file||!selected)return;

 const name=selected;
 const reader=new FileReader();

 reader.onload=()=>{
  const img=new Image();

  img.onload=()=>{
   const canvas=document.createElement("canvas");
   canvas.width=300;
   canvas.height=360;

   const ctx=canvas.getContext("2d");
   const scale=Math.max(
    300/img.width,360/img.height
   );

   ctx.drawImage(
    img,
    (300-img.width*scale)/2,
    (360-img.height*scale)/2,
    img.width*scale,
    img.height*scale
   );

   const previous=data.images[name];
   data.images[name]=canvas.toDataURL("image/jpeg",0.72);

   if(!saveData()){
    if(previous)data.images[name]=previous;
    else delete data.images[name];
    return;
   }

   renderGrid();
   openModal(name);
  };

  img.src=reader.result;
 };

 reader.readAsDataURL(file);
 e.target.value="";
};

// バックアップファイルを書き出す
$("exportBtn").onclick=()=>{
 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
 link.download="スマブラSP対策バックアップ.json";
 link.click();

 setTimeout(()=>URL.revokeObjectURL(url),3000);
};

// バックアップを復元
$("importBtn").onclick=()=>$("importFile").click();

$("importFile").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const imported=JSON.parse(reader.result);

   if(!imported.notes||!imported.images||
      typeof imported.notes!=="object"||
      typeof imported.images!=="object")
    throw Error("Invalid format");

   if(!confirm("現在のデータをバックアップの内容で置き換えますか？"))
    return;

   const previous=data;
   data=imported;

   if(!saveData()){
    data=previous;
    return;
   }

   renderGrid();
   alert("復元が完了したよ！");
  }catch(err){
   alert("正しいバックアップファイルを選んでね。");
  }
 };

 reader.readAsText(file);
 e.target.value="";
};

renderGrid();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => {
        console.log("オフライン機能の登録完了");
      })
      .catch(error => {
        console.error("オフライン登録失敗", error);
      });
  });
}
</script>
</body>
</html>
